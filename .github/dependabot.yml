# Configuration file for Dependabot (https://github.com/dependabot)

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: daily
      time: '03:00'
    cooldown:
      default-days: 2
    labels:
      - dependencies
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: daily
      time: '03:00'
    cooldown:
      default-days: 2
    labels:
      - ci/cd
      - dependencies
    groups:
      codeql:
        patterns:
          - asdf-vm/actions/*
          - github/codeql-action/*
