name: Weekly
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch: ~

permissions: read-all

jobs:
  npm-transitive:
    name: package-lock.json
    runs-on: ubuntu-26.04
    permissions:
      contents: write # To push a commit
      pull-requests: write # To open a Pull Request
    steps:
      - name: Verify action checksums
        uses: $/.github/actions/ghasum
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm clean-install
      - name: Update dependencies
        run: |
          npm update --prefer-dedupe
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -B 'bump-transitive-dependencies'
          git add 'package.json' 'package-lock.json'
          git commit --message 'Bump transitive dependencies with `npm update`'

          git remote set-url 'origin' "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}"
          git push --force 'origin' 'bump-transitive-dependencies'

          gh pr create \
            --base='main' --head='bump-transitive-dependencies' \
            --label='dependencies' \
            --title='Bump transitive dependencies' \
            --body='_This Pull Request was created automatically_'
  tooling:
    name: .tool-version
    runs-on: ubuntu-26.04
    permissions:
      contents: write # To push a commit
      pull-requests: write # To open a Pull Request
    steps:
      - name: Verify action checksums
        uses: $/.github/actions/ghasum
      - name: Update tooling
        uses: ericcornelissen/tool-versions-update-action/pr@v2.2.2
        with:
          labels: dependencies
          max: 1
          pr-body: |
            Bumps {{updated-tools}} from {{updated-old-versions}} to {{updated-new-versions}}.

            ---

            _This Pull Request was generated using the [tool-versions-update-action]._

            [tool-versions-update-action]: https://github.com/ericcornelissen/tool-versions-update-action
          pr-title: Bump {{updated-tools}} from {{updated-old-versions}} to {{updated-new-versions}}
          token: ${{ github.token }}
          install-tools: false
