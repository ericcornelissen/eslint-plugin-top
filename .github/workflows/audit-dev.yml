name: Audit (dev)
on:
  pull_request:
    paths:
      - .github/workflows/audit-dev.yml
      - .ndmrc
      - .nsprc
  schedule:
    - cron: '0 1 * * 2'
  workflow_dispatch: ~

permissions: read-all

jobs:
  deprecations:
    name: Deprecations
    runs-on: ubuntu-26.04
    steps:
      - name: Verify action checksums
        uses: $/.github/actions/ghasum
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm clean-install
      - name: Audit for deprecation warnings
        run: npm run audit:deprecations
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-26.04
    permissions:
      contents: write # To push a commit
      pull-requests: write # To open a Pull Request
    steps:
      - name: Verify action checksums
        uses: $/.github/actions/ghasum
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm clean-install
      - name: Audit for vulnerabilities
        run: npm run audit:vulnerabilities
      - name: Bump vulnerable dependencies
        if: github.event_name == 'schedule' && failure()
        run: npm audit fix
      - name: Create Pull Request
        if: github.event_name == 'schedule' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -B 'bump-vulnerable-dependencies'
          git add 'package.json' 'package-lock.json'
          git commit --message 'Bump vulnerable dependencies with `npm audit fix`'

          git remote set-url 'origin' "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}"
          git push --force 'origin' 'bump-vulnerable-dependencies'

          gh pr create \
            --base='main' --head='bump-vulnerable-dependencies' \
            --label='dependencies' --label='security' \
            --title='Bump vulnerable dependencies' \
            --body='_This Pull Request was created automatically based on at least one known vulnerability detected in CI._'
